{% extends "base.html" %}

{% block title %}Заказ оформлен | Matterly{% endblock %}

{% block content %}
<section class="py-16 px-4">
    <div class="max-w-md mx-auto text-center">
        <div class="glass p-8 rounded-2xl">
            <div class="w-16 h-16 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
                <span class="text-2xl">✅</span>
            </div>
            
            <h1 class="text-2xl font-bold text-text-primary mb-4">Заказ успешно оформлен!</h1>
            
            <p class="text-text-secondary mb-2">
                Номер вашего заказа: <strong class="text-accent">#{{ order_id }}</strong>
            </p>
            
            <p class="text-text-secondary mb-6">
                Мы свяжемся с вами в ближайшее время для подтверждения заказа.
            </p>
            
            <div class="space-y-3">
                <a href="{{ url_for('catalog') }}" 
                   class="block w-full py-3 bg-accent text-dark-900 font-bold rounded-xl hover:bg-opacity-90 transition">
                    Вернуться в каталог
                </a>
                <a href="{{ url_for('index') }}" 
                   class="block w-full py-3 glass text-text-primary font-medium rounded-xl border border-white/10 hover:border-accent transition">
                    На главную
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
