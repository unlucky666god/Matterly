{% extends "admin/base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-6">
        {{ 'Редактирование статьи' if article else 'Новая статья' }}
    </h1>

    <form method="POST" enctype="multipart/form-data" class="max-w-4xl">
        <div class="bg-white rounded-lg shadow p-6 space-y-6">
            <!-- Основные поля -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Заголовок *</label>
                    <input type="text" name="title" value="{{ article.title if article }}"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Slug (URL)</label>
                    <input type="text" name="slug" value="{{ article.slug if article }}"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md"
                        placeholder="auto-generate-from-title">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Краткое описание *</label>
                <textarea name="excerpt" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md"
                    required>{{ article.excerpt if article }}</textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Содержание *</label>
                <textarea name="content" rows="10" class="w-full px-3 py-2 border border-gray-300 rounded-md"
                    required>{{ article.content if article }}</textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Дата публикации</label>
                    <input type="date" name="date" value="{{ article.date if article else now_date }}"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Изображение *</label>
                    <input type="file" name="image" accept="image/*"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md" {{ ' ' if article else 'required' }}>

                    {% if article and article.image %}
                    <div class="mt-2">
                        <img src="{{ url_for('static', filename='content/' + article.image) }}" alt="Current image"
                            class="w-32 h-32 object-cover rounded">
                        <p class="text-sm text-gray-500 mt-1">Текущее изображение</p>
                    </div>
                    {% endif %}
                </div>
            </div>

            <!-- Кнопки -->
            <div class="flex justify-end space-x-4 pt-6">
                <a href="{{ url_for('admin_articles') }}"
                    class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
                    Отмена
                </a>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                    {{ 'Сохранить' if article else 'Создать' }}
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
